<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 阅读器 · CodexWUI</title>
  <link rel="stylesheet" href="/pdf-viewer.css">
</head>
<body>
  <nav aria-label="PDF 阅读工具">
    <button id="previous" type="button" disabled aria-label="上一页">←</button>
    <form id="page-form"><input id="page-number" type="number" min="1" value="1" aria-label="页码" disabled><span id="page-count">/ —</span></form>
    <button id="next" type="button" disabled aria-label="下一页">→</button>
    <button id="zoom-out" type="button" disabled aria-label="缩小">−</button>
    <button id="fit-width" type="button" disabled>适应宽度</button>
    <button id="zoom-in" type="button" disabled aria-label="放大">＋</button>
    <a id="browser-file" target="_blank" rel="noopener noreferrer" hidden>浏览器打开 ↗</a>
    <a id="download-file" download hidden>下载</a>
  </nav>
  <p id="status" role="status">正在加载 PDF 阅读器…</p>
  <form id="password-form" hidden><label>PDF 密码 <input id="password" type="password" autocomplete="off" required></label><button type="submit">打开</button></form>
  <main id="viewport" tabindex="0" aria-label="PDF 页面"><canvas id="page" hidden></canvas></main>
  <script src="/file-links.js"></script>
  <script type="module" src="/pdf-viewer.js"></script>
</body>
</html>
